bundle:
  name: bricksbot

include:
  - resources/jobs/*.yml
  # Optional workspace overrides (gitignored). Copy from dev.local.yml.example.
  - '*.local.yml'

variables:
  app_name:
    description: Databricks App name. For a second install in one workspace, set it in a separate target so deploy state stays apart
    default: bricksbot
  lakebase_branch:
    description: Lakebase branch resource name (projects/<project>/branches/<branch>)
  lakebase_database:
    description: Lakebase database resource name (…/databases/<database>)
  genie_space_id:
    description: Optional Genie space id for ask_genie_space (see the genie-space resource below). Unused while that resource is commented out
    default: ''
  sql_warehouse_id:
    description: SQL warehouse id for sql_query / lakehouse_catalog (user OBO + SP CAN_USE)
  serving_endpoint_name:
    description: Model Serving chat endpoint that supports tool calling. Defaults to a Foundation Model API pay-per-token endpoint; `npm run bootstrap` lets you pick another
    default: databricks-gpt-oss-120b
  provider_secret_scope:
    description: Secret scope holding the OpenRouter (or compatible) API key
    default: bricksbot
  provider_secret_key:
    description: Secret key holding the OpenRouter (or compatible) API key
    default: openrouter-api-key
  app_secret_scope:
    description: Secret scope for BricksBot-only settings (e.g. web_fetch allowlist)
    default: bricksbot
  routine_webhook_app_base_url:
    description: Deployed App origin without trailing slash (databricks apps get bricksbot)
    default: ''
  routine_webhook_routine_id:
    description: Routine UUID from Routines trust banner / list row
    default: ''
  routine_webhook_secret_scope:
    description: Secret scope holding the routine webhook shared secret
    default: ${var.app_secret_scope}
  routine_webhook_secret_key:
    description: Secret key name for the routine webhook (value via put-secret)
    default: routine-webhook-key
  routine_webhook_quartz_cron:
    description: Quartz 6-field cron for the example Lakeflow Job
    default: '0 0 9 * * ?'
  routine_webhook_timezone_id:
    description: Timezone for the example Job schedule
    default: UTC
  routine_webhook_pause_status:
    description: Example Job schedule state; set UNPAUSED once the webhook vars are filled
    default: PAUSED

resources:
  apps:
    app:
      name: ${var.app_name}
      description: 'BricksBot — Grok-shaped multi-bot chat on the lakehouse'
      source_code_path: ./

      lifecycle:
        started: true

      # Interactive sql_query / lakehouse_catalog / volume_read / volume_write use the signed-in
      # user's token (OBO). sql:restricted-query matches read-only SQL. files.files covers Volume read and write.
      user_api_scopes:
        - sql:restricted-query
        - files.files
        - ai-gateway
        # Optional Genie space (ask_genie_space): uncomment with the genie-space resource below.
        # - genie
        # Optional knowledge base (search_knowledge): uncomment with BRICKSBOT_KB_* in app.yaml.
        # - vector-search

      resources:
        - name: postgres
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        # LLM provider: exactly one of the two blocks is enabled. `npm run bootstrap` flips them
        # (and the matching block in app.yaml, so it edits both tracked files); by hand, comment one
        # and uncomment the other. Keep comments out of the blocks: bootstrap comments every line between the markers.
        # llm:openrouter begin
        # - name: openrouter-api-key
        #   secret:
        #     scope: ${var.provider_secret_scope}
        #     key: ${var.provider_secret_key}
        #     permission: READ
        # llm:openrouter end
        # llm:serving begin
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        # llm:serving end
        # Optional web_fetch allowlist. Create the secret, then uncomment this and
        # WEB_FETCH_ALLOWLIST in app.yaml. web_fetch stays off while unset.
        # - name: web-fetch-allowlist
        #   secret:
        #     scope: ${var.app_secret_scope}
        #     key: web-fetch-allowlist
        #     permission: READ
        # Optional single Genie space for ask_genie_space. Set genie_space_id, then uncomment this,
        # the `genie` scope above and BRICKSBOT_GENIE_SPACE_ID in app.yaml. The tool stays
        # unregistered while unset. It runs as the user (CAN_RUN on the space); Genie bills compute.
        # - name: genie-space
        #   genie_space:
        #     name: BricksBot Genie space
        #     space_id: ${var.genie_space_id}
        #     permission: CAN_RUN

targets:
  # Workspace-specific host, Lakebase paths, and warehouse id live in a
  # gitignored `*.local.yml` (see dev.local.yml.example) or `--var` / BUNDLE_VAR_*.
  # Pick the workspace with `-p <profile>`; host comes from ~/.databrickscfg.
  dev:
    default: true
    mode: development
