command: ['npm', 'run', 'start']

env:
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres

  # SQL warehouse for sql_query / lakehouse_catalog (id injected from app resource)
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse

  # OpenAI-compatible LLM (default scope `bricksbot`, key `openrouter-api-key`)
  - name: OPENROUTER_API_KEY
    valueFrom: openrouter-api-key
  - name: LLM_BASE_URL
    value: https://openrouter.ai/api/v1
  - name: LLM_MODEL
    value: openai/gpt-6-luna
  - name: LLM_SECRET_SCOPE
    value: bricksbot
  - name: LLM_SECRET_KEY
    value: openrouter-api-key

  - name: WEB_FETCH_ALLOWLIST
    valueFrom: web-fetch-allowlist

  # Optional: surfaced on GET /api/setup/status as appPublicUrl (UI may use window.location when open)
  # - name: BRICKSBOT_PUBLIC_APP_URL
  #   value: https://bricksbot-1234567890123456.us-west-2.databricksapps.com

  # Databricks Serving option (bind a serving-endpoint resource, then uncomment):
  # - name: LLM_PROVIDER
  #   value: databricks
  # - name: DATABRICKS_SERVING_ENDPOINT_NAME
  #   valueFrom: serving-endpoint

  # Phase 5 Sandbox — Databricks Sandboxes (Public Beta); falls back to system.ai.python_exec if preview is off:
  - name: SANDBOX_BACKEND
    value: 'databricks'
  # - name: SANDBOX_IDLE_MINUTES
  #   value: "15"
  # - name: SANDBOX_EXEC_TIMEOUT_SEC
  #   value: "120"
  # - name: SANDBOX_MAX_SESSION_MINUTES
  #   value: "120"
  # - name: SANDBOX_MAX_ACTIVE_PER_USER
  #   value: "3"
  # UC Volume root for volume_write and sandbox artifact saves.
  # Files land at {root}/users/{user}/bots/{bot}/. SANDBOX_ARTIFACT_VOLUME_PATH is a legacy alias.
  # Operator creates the volume and grants WRITE. This app does not create the volume.
  # - name: BRICKSBOT_VOLUME_ROOT
  #   value: /Volumes/main/default/bricksbot_artifacts/bricksbot
  # - name: BRICKSBOT_VOLUME_WRITE_MAX_BYTES
  #   value: "8388608"
  # - name: BRICKSBOT_VOLUME_USER_QUOTA_BYTES
  #   value: "268435456"
  # Per-bot cap is off when unset.
  # - name: BRICKSBOT_VOLUME_BOT_QUOTA_BYTES
  #   value: "67108864"
