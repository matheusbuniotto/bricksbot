name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Local (npm run dev)
        - Deployed Databricks App
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. v0.1.0 or a commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `databricks apps logs bricksbot` or the browser console. Remove hosts, tokens and ids first.
      render: text
